# ----- 神经网络 (YOLO) -----
yolo_name: "yolov5"                 # 模型名: "yolov5" | "yolov8" | "yolo11"
device: auto                     # 推理设备：auto（优先 GPU，不可用则 CPU）
yolov5_model_path: "assets/yolov5.xml"
yolov8_model_path: "assets/yolov8.xml"
yolo11_model_path: "assets/yolo11.xml"
classify_model: "assets/tiny_resnet.onnx"  # 分类器模型 (传统方法用)
min_confidence: 0.8                 # 检测最小置信度
use_traditional: true               # 是否启用传统视觉方法作为后备

# ----- ROI (感兴趣区域) -----
use_roi: false                      # 是否启用 ROI 裁剪
roi:                                # ROI 区域 (像素坐标)
  x: 420
  y: 50
  width: 600
  height: 600

# ----- 传统视觉方法参数 -----
threshold: 150                      # 二值化阈值
max_angle_error: 45                 # 灯条最大角度误差 (度)
min_lightbar_ratio: 1.5             # 灯条最小长宽比
max_lightbar_ratio: 20              # 灯条最大长宽比
min_lightbar_length: 8              # 灯条最小长度 (像素)
min_armor_ratio: 1                  # 装甲板最小长宽比
max_armor_ratio: 5                  # 装甲板最大长宽比
max_side_ratio: 1.5                 # 配对灯条最大边长比
max_rectangular_error: 25           # 最大矩形拟合误差 (度)

# ----- 跟踪器 (Tracker/EKF) -----
min_detect_count: 5                 # 连续检测到多少次后进入跟踪状态
max_temp_lost_count: 25             # 普通目标最大临时丢失帧数
outpost_max_temp_lost_count: 75     # 前哨站目标最大临时丢失帧数

# ----- 瞄准器 (Aimer) -----
yaw_offset: -0.8                    # yaw 整体偏移 (度)，单枪管只调这一个
pitch_offset: -1.0                  # pitch 整体偏移 (度)
comming_angle: 60                   # 陀螺旋转 coming angle 阈值 (度)
leaving_angle: 20                   # 陀螺旋转 leaving angle 阈值 (度)
decision_speed: 10                  # 高速/低速判定阈值 (rad/s)
high_speed_delay_time: 0.026        # 高速状态下弹道延迟时间 (s)
low_speed_delay_time: 0.010         # 低速状态下弹道延迟时间 (s)

# ----- 射手 (Shooter) -----
auto_fire: true                     # 是否由自瞄自动控制开火
first_tolerance: 5                  # 近距离射击容差 (度)
second_tolerance: 2                 # 远距离射击容差 (度)
judge_distance: 3                   # 近/远距离判断阈值 (m)

# ----- 决策器 (Decider) -----
mode: 1                             # 决策模式 (影响全向感知的搜索行为)

# =============================================================================
#  坐标变换树 tf
#
#  作用：把「每个元件相对旋转轴的位置 + 姿态」变成配置里的标定值，
#        代码里不再出现任何安装尺寸/安装角。等同 nav2 里的 tf 树。
#
#  机械链（与实车一一对应）：
#      world
#      ├── yaw_axis      大yaw 旋转轴（只有 yaw）——全向相机都挂在这上面
#      │   ├── omni_cam_1 … omni_cam_4
#      └── small_yaw     小yaw 板（yaw + pitch + roll）——主相机挂在这上面
#          └── main_cam
#
#  · yaw_axis / small_yaw 是**动态关节**，每帧由 0x502 刷新，不要填数值：
#        yaw_axis  = Rz(lower_yaw)
#        small_yaw = Rz(upper_yaw)·Ry(pitch)·Rx(roll)
#  · omni_cam_i / main_cam 是**静态边**，填标定结果：
#        写法一：xyz: [x,y,z] 米   + rpy_deg: [roll, pitch, yaw] 度（Z-Y-X）
#        写法二：R: [9个数,行优先] + t: [x,y,z]
#    含义是 p_parent = R * p_camera + t，即「相机 -> 父帧」。
#  · 没填数值的静态边会被忽略（回退到下面的 omni_*_N / R_camera2gimbal），
#    所以标定完成前保持注释即可，不影响现有行为。
# =============================================================================
tf:
  frames:
    # 大yaw 旋转轴：原点就是 world 原点（上电瞬间的转轴位置），所以 offset 为 0
    yaw_axis:
      parent: world
      joint: lower_yaw

    # 小yaw 板：与大yaw 同轴、但高出一个 h。原点取枪管根部（俯仰电机轴心）
    small_yaw:
      parent: world
      joint: upper_pitch_roll
      # offset: [0.0, 0.0, 0.004]   # 米；= 枪管根部离大yaw 轴原点的高度差

    # ---- 四个全向相机：相机 -> 大yaw 旋转轴（含光心到转轴的距离，解决视差）
    #      xyz  = 光心在 yaw_axis 系下的位置（米）
    #      mount_deg = [yaw, pitch, roll] 度：光轴朝向，yaw 左正 / pitch 低头正 / roll 绕光轴
    #      （也可以用 R + t 直接给矩阵，优先级最高）
    omni_cam_1:
      parent: yaw_axis
      # xyz: [0.0, 0.0, 0.0]
      # mount_deg: [0.0, 0.0, 0.0]
    omni_cam_2:
      parent: yaw_axis
      # xyz: [0.0, 0.0, 0.0]
      # mount_deg: [0.0, 0.0, 0.0]
    omni_cam_3:
      parent: yaw_axis
      # xyz: [0.0, 0.0, 0.0]
      # mount_deg: [0.0, 0.0, 0.0]
    omni_cam_4:
      parent: yaw_axis
      # xyz: [0.0, 0.0, 0.0]
      # mount_deg: [0.0, 0.0, 0.0]

    # ---- 主相机：相机 -> 小yaw 板（板子的参考系即 0x502 的 pitch/roll/upper_yaw）----
    main_cam:
      parent: small_yaw
      # xyz: [0.0, 0.0, 0.0]
      # mount_deg: [0.0, 0.0, 0.0]

