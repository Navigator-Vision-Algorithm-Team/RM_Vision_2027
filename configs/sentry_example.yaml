# =============================================================================
#  sentry_multithread 示例配置文件
#  使用方式: ./build/sentry_multithread configs/sentry_example.yaml
# =============================================================================

# ----- 敌方颜色 -----
# 可选值: "red" 或 "blue"
enemy_color: "red"

# ----- 串口通信 (SerialBoard) -----
com_port: '/dev/ttyACM0'            # 串口设备路径
baud_rate: 921600                    # 波特率
bullet_speed: 28.0                   # 默认弹速 (m/s), 会被下位机数据覆盖

# ----- 主相机 (sursign="main") -----
# camera_name 决定相机类型: "hikrobot" | "mindvision" | "Usbcamera"
camera_name_main: "hikrobot"
exposure_ms_main: 40.0               # 曝光时间 (ms)
gain_main: 8.0                     # 增益 (HikRobot 用, MindVision 用 gamma_main)
serial_number_main: "DA2024629"              # 相机序列号 (唯一匹配方式)
transfer_size_main: 1048576            # USB 传输大小 (字节, 1MB)
frame_rate_main: 120.0             


# ----- 全向感知相机数量 -----
# 0 = 不启用全向感知 (等价于普通自瞄)
omni_camera_count: 4

# ----- 全向相机 1 (sursign="omni1") -----
camera_name_omni1: "hikrobot"
exposure_ms_omni1: 50.0
gain_omni1: 8.0
serial_number_omni1: "DA6415777"
transfer_size_omni1: 1048576          # USB 传输大小 (字节, 1MB)
frame_rate_omni1: 15.0              # 全向相机建议更保守
grab_timeout_ms_omni1: 500
omni_mount_yaw_1: 315.0              # 相机光轴相对机器人正前方的 yaw 偏移 (度)
omni_mount_pitch_1: 0.0             # 相机光轴相对水平面的 pitch 偏移 (度)
# 如果是640*480 因该是这
omni_fov_h_1: 36.35                  # 相机水平 FOV (度)
omni_fov_v_1: 27.60                  # 相机垂直 FOV (度)
# 这是1440 1080
# omni_fov_h_1: 72.8                  # 相机水平 FOV (度)
# omni_fov_v_1: 57.9                  # 相机垂直 FOV (度)

# --- 【新增】全向相机 1 的 PnP 标定参数（全部可选）---
# 说明：全向相机现在改用与主相机相同的 PnP 解算装甲板方向（实现见
#       tasks/omniperception/omni_pnp.cpp 与 decider.cpp::delta_angle）。
#       下面 4 项留空时程序会自动用占位方案（仍走 PnP）：
#         内参空 -> 用 omni_fov_h_1/omni_fov_v_1 + 图像尺寸估算针孔内参
#         畸变空 -> 视为无畸变
#         外参空 -> 用 omni_mount_yaw_1/omni_mount_pitch_1 近似构造旋转，平移置 0
#       拿到标定结果后请取消注释并填入真实值，精度会明显提升。
#
# 内参 3x3（行优先，9 个数）：[fx, 0, cx, 0, fy, cy, 0, 0, 1]
omni_camera_matrix_1: [
  967.85421433, 0, 302.77130393,
  0, 966.38511616, 347.68952457,
  0, 0, 1
]

# 畸变系数 (k1, k2, p1, p2, k3)
omni_distort_coeffs_1: [
  0.04623507,
  -0.06477922,
  -0.00036205,
  0.00077141,
  0.00880502
]
