# =============================================================================
#  info_relay 配置：串口与导航通信中转进程
#
#  启动：./build/info_relay/info_relay configs/info_relay.yaml
#  职责：整机唯一打开串口的进程；解析下位机协议后通过 iceoryx2 发布，
#        并把视觉下发的云台指令写回串口。视觉进程不再持有串口。
#
#  与视觉配置的关系：本文件只含"通信"相关参数；视觉程序读取自己的配置文件，
#  其中 relay_prefix / relay_timeout_ms 必须与本文件一致，否则两边连不上。
# =============================================================================

#####-----数据源-----#####
# 数据源模式：real 真实串口 / fake 内置虚拟下位机 / replay 回放录制字节
# 作用：决定 IByteTransport 的实现；fake 与 replay 用于无硬件联调
# 取值：real | fake | replay；缺省 real
source_mode: "real"

#####-----串口参数-----#####
# 串口设备路径：real 模式必填；fake 模式配合 fake_serial_external=true 时指向外部 pty
# 取值：/dev/ttyACM0、/dev/gimbal 等；缺失时进程直接退出（中继没有串口就无事可做）
com_port: "/dev/gimbal"
# 波特率：必须与下位机一致，否则收到的全是乱码帧
# 取值：921600 为本项目固件默认；改动后需同步下位机
baud_rate: 921600

#####-----下行指令-----#####
# 默认弹速，m/s：写入 Imu/Health 之外的转发逻辑时使用；实车会被下位机数据覆盖
# 取值：10 ~ 30；本项目 17mm 常用 23 ~ 28
bullet_speed: 28.0
# 热量保护提前量，热量单位：热量达到 上限-该值时停止下发开火位
# 取值：5 ~ 20；17mm 单发约 10 点热量，10 表示"再打一发就顶线"
heat_stop_margin: 10

#####-----裁判与比赛状态-----#####
# 是否依赖裁判系统判定开赛：false 时不做开赛门控，始终视为已开赛
use_referee_system: false
# 判定"比赛进行中"的 game_progress 阈值：0 未开始 / 4 比赛中
game_start_progress_threshold: 4
# IMU 安装轴：upper 表示 IMU 装在小yaw（主相机）板上，lower 表示装在大yaw 轴上
# 取值：upper | lower；装错会让双yaw 的两个世界角互换
gimbal_imu_axis: upper

#####-----跨进程通信-----#####
# 主题名前缀：relay 发布的主题为 <prefix>/imu、<prefix>/cmd_aim 等
# 作用：同机跑多套实例时用不同前缀隔离；视觉侧配置里必须写同一个值
relay_prefix: "rm_vision"
# 链路失效阈值，ms：超过该时长没收到任何上行帧即判链路中断
# 作用：视觉侧据此把 can_shoot 收敛到 false；relay 侧据此在 Health 里置 transport_ok=0
# 取值：100 ~ 1000；过小会在帧抖动时误判断链，过大则故障发现不及时
relay_timeout_ms: 200

#####-----录制（可选）-----#####
# 是否记录串口原始字节（serial.bin），用于事后复现
record:
  # 开关：true 时写 <dir>/serial.bin
  enable: false
  # 录制目录，相对启动时的工作目录
  dir: "logs/relay_session"
  # 是否同时记录图像：本进程不含相机，该键仅为与视觉配置保持一致而保留
  save_images: false

#####-----虚拟数据源（fake / replay）-----#####
# 以下键只在 source_mode 为 fake 或 replay 时生效
# 虚拟云台姿态频率，Hz：模拟 0x0503 的发送频率，500 与实车一致
fake_imu_hz: 500.0
# 虚拟底盘反馈频率，Hz：模拟 0x0502
fake_chassis_hz: 50.0
# 虚拟裁判转发频率，Hz：模拟 0x0001/0x0201
fake_status_hz: 1.0
# 虚拟机器人 ID：红方 1~11、蓝方 101~111；0 表示不模拟裁判身份
fake_robot_id: 7
# 回放时使用的原始字节文件
serial_replay_file: "logs/relay_session/serial.bin"
