# ============================================================================
#  IMM / EKF 调参配置
#
#  改完不需要重新编译，直接跑 ekf_bench 或实车程序即可生效。
#  文件读不到或某个键缺失时，使用代码内默认值（与本文件一致）。
#
#  格式说明（每个参数都按这个格式写）：
#     含义 / 单位 / 建议范围 / 调大调小的后果
#
#  三个模型固定为 M1 匀速 / M2 匀加速 / M3 静止，顺序不可调换。
#
#  调参顺序（重要）：
#      1) 先调 measurement（R），把 nis/dof 拉到 0.8 ~ 1.2
#      2) 再调 models 里的 sa2 / v2
#      3) 最后调 transition
#      每次只改一个参数，跑全部 6 个场景看综合分。
# ============================================================================


# ============================================================================
#  一、运动模型（每个模型一套，这是 IMM 的“假设”）
# ============================================================================
models:
  - name: "cv"
    # M1 匀速模型：加速度状态每帧清零
    #
    # sa2: 每帧加速度增量的方差
    #   单位: (m/s^2)^2
    #   范围: 1 ~ 50
    #   100Hz 下等价于速度每帧抖动 sqrt(sa2)*0.01 m/s（10 → 0.03 m/s）
    #   调大: 跟踪快、急变向不滞后，但稳态抖
    #   调小: 平滑，但急停急起慢半拍
    sa2: 10.0

    # v2: 角加速度方差
    #   单位: (rad/s^2)^2
    #   范围: 100 ~ 600（超过 600 会明显拖累远距离场景）
    #   调大: 角速度 w 响应快、小陀螺跟得上，但 w 抖
    #   调小: w 稳，但起转时滞后
    v2: 150.0

    # ca: 加速度状态是否延续
    #   false = 每帧清零（匀速模型）；true = 延续（匀加速模型）
    #   一般不要动，改了就不是这个模型了
    ca: false

    # damping: 平移速度是否指数衰减
    #   true 时用 motion.damping_tau 作为时间常数
    #   一般不要动
    damping: false

  - name: "ca"
    # M2 匀加速模型：加速度状态延续并参与位置/速度递推
    #   范围与调大调小同上；这一项决定“急停急起跟不跟得上”
    sa2: 10.0
    v2: 400.0
    ca: true
    damping: false

  - name: "static"
    # M3 静止模型：平移速度指数衰减、加速度清零
    #
    # sa2: 静止模型的过程噪声
    #   范围: 0.01 ~ 1（这个模型要“几乎不动”，不要给大）
    #   调大: 允许蹲点目标轻微移动
    #   调小: 更硬的“速度=0”假设
    sa2: 0.1
    # v2: 范围 100 ~ 600；不要低于 50，否则 w 会被压死
    v2: 150.0
    ca: false
    damping: true


# ============================================================================
#  二、运动细节
# ============================================================================
motion:
  # acc_damping: M2 匀加速模型的加速度衰减系数
  #   范围: 0.85 ~ 0.95
  #   调大（接近 1）: 加速度能无限漂移，机动响应猛，但远距离会把位置和 yaw 带抖
  #   调小（0.85）: 加速度更“听话”，稳态稳，但急变向慢
  acc_damping: 0.90

  # damping_tau: M3 静止模型的平移速度衰减时间常数
  #   单位: 秒
  #   范围: 0.2 ~ 0.5
  #   调大: 静止模型更像匀速模型
  #   调小: 静止判定更硬，但会拖累平移跟踪
  damping_tau: 0.30


# ============================================================================
#  三、模型切换（IMM 层，三个模型共用一套规则）
# ============================================================================
transition:
  # diag: 模型保持概率
  #   范围: 0.85 ~ 0.95
  #   平均驻留时间 = 1/(1-diag) 帧；0.90 → 10 帧 = 0.1 秒
  #   调大(0.95): 切换慢、mu 平滑，但目标真变了要 0.2 秒才反应
  #   调小(0.85): 切换快，但 mu 会一直抖
  diag: 0.90

  # off_diag: 跳转到其它模型的概率
  #   范围: 0.025 ~ 0.075
  #   硬约束: off_diag 必须等于 (1 - diag) / 2，否则程序会自动修正并打警告
  off_diag: 0.05

probability:
  # initial: 启动时三个模型的权重
  #   范围: 每项 0~1，三项之和必须为 1
  #   只影响开头一两秒，一般不用动
  initial: [0.8, 0.15, 0.05]

  # floor: 模型概率下限
  #   范围: 1e-3 ~ 1e-2
  #   调大: 冷门模型复活快，但会污染输出
  #   调小: 低于 1e-4 容易让某个模型永久锁死，再也回不来
  floor: 0.001


# ============================================================================
#  四、鲁棒更新（软降权，替代硬门控）
# ============================================================================
huber:
  # enable: 是否启用 Huber 软降权
  #   false 时退化为标准 EKF（做 A/B 对比用）
  enable: true

  # k: 降权阈值（马氏距离超过它就按 k/√nis 降权）
  #   范围: 2.5 ~ 3.5
  #   -1 表示自动，取 sqrt(chi2_quantile_95(4)) ≈ 3.08
  #   调大: 更信任观测，离群点影响大
  #   调小: 更保守，正常观测也会被降权
  k: -1.0

  # block_size: 逐块降权的块大小
  #   硬约束: 必须为 4，与 4 维量测（yaw/pitch/distance/armor_yaw）绑定，不要改
  block_size: 4


# ============================================================================
#  五、观测噪声 R（最该先调的，决定 nis/dof 是否正常）
#
#  R 在数学上是 4x4 矩阵，程序只取对角，即 4 个方差：
#      R = diag(R_yaw, R_pitch, R_dist, R_ayaw)
#  这 4 个方差由下面 6 个参数生成：
#      R_yaw  = yaw_var
#      R_pitch = pitch_var
#      R_dist = distance_gain * log(|Δangle|+1) + distance_offset
#      R_ayaw = armor_yaw_gain * log(distance+1) + armor_yaw_offset
#
#  硬约束: 三个模型必须共用同一份 R，不能按模型单独设。
#  判断标准: 跑 ekf_bench 看 nis/dof，目标 0.8 ~ 1.2（越小说明 R 越大）。
# ============================================================================
measurement:
  # yaw_var: 方位角方差
  #   单位: rad^2（σ = sqrt(值)，0.004 → σ ≈ 3.6°）
  #   范围: 0.001 ~ 0.02（σ 约 1.8° ~ 8°）
  #   调大: 更信运动模型，平滑但滞后
  #   调小: 更信观测，跟得快但抖
  yaw_var: 0.004

  # pitch_var: 俯仰角方差，规则同 yaw_var
  pitch_var: 0.004

  # distance_gain: 距离方差随“目标偏离视野中心角度”增长的系数
  #   单位: m^2（乘在 log 上）
  #   范围: 0.05 ~ 1.0（**这一项影响最大**，优先调它）
  #   当前 1.0 偏大，是 nis/dof 只有 0.03~0.7 的主因
  #   实测: 1.0 → 0.1 后，far_noisy 的 nis/dof 从 0.71 升到 1.39，
  #         turn/uniform 的 pos_rmse 降约 30%，但 spin 会退化约 35%
  distance_gain: 1.0

  # distance_offset: 距离方差的下限（Δangle=0 时的值）
  #   单位: m^2（σ = sqrt(值)，1.0 → σ ≈ 1 米）
  #   范围: 0.01 ~ 1.0
  #   调大: 距离几乎不被采信，位置主要靠运动模型外推
  #   调小: 更信 PnP 的深度，远距离可能被深度噪声带偏
  distance_offset: 1.0

  # armor_yaw_gain: 装甲板朝向方差随距离增长的系数
  #   单位: rad^2（乘在 log 上）
  #   范围: 0.001 ~ 0.02
  armor_yaw_gain: 0.005

  # armor_yaw_offset: 装甲板朝向方差的下限
  #   单位: rad^2（σ = sqrt(值)，0.09 → σ ≈ 17°）
  #   范围: 0.01 ~ 0.5
  #   调大: 更不信 PnP 解出的装甲板朝向
  #   调小: 更信朝向，但远距离容易被噪声带偏
  armor_yaw_offset: 0.09


# ============================================================================
#  六、初始协方差 P0（14 个对角元）
#  顺序: x vx y vy z vz a w r l h ax ay az
#
#  只影响开头几帧，之后会被观测拉平，不用精调。
# ============================================================================
initial_covariance: [1, 64, 1, 64, 1, 64, 0.4, 100, 1, 1, 1, 25, 25, 25]
#  逐项范围与含义：
#   [0]  x          位置      范围 0.1 ~ 10       调大: 开头收敛快但抖
#   [1]  vx         速度      范围 10 ~ 100       64 → σ=8 m/s，偏宽松
#   [2]  y          位置      同上
#   [3]  vy         速度      同上
#   [4]  z          位置      同上
#   [5]  vz         速度      同上
#   [6]  a          角度      范围 0.1 ~ 1        0.4 → σ≈36°
#   [7]  w          角速度    范围 50 ~ 200       100 → σ=10 rad/s
#   [8]  r          半径      范围 0.01 ~ 1       **当前 1 偏大**（σ=1m，真实半径仅 0.2m）
#   [9]  l          半径差    范围 0.01 ~ 1       真实为 0，建议 0.01
#   [10] h          高度差    范围 0.01 ~ 1       真实为 0，建议 0.01
#   [11] ax         加速度    范围 4 ~ 100        25 → σ=5 m/s^2
#   [12] ay         加速度    同上
#   [13] az         加速度    同上


# ============================================================================
#  七、一致性与复位（判断“目标是否跟丢了”）
# ============================================================================
consistency:
  # window_seconds: NIS 统计的滑动窗口长度
  #   单位: 秒
  #   范围: 0.5 ~ 3.0
  #   调大: 判 lost 更迟钝（更宽容）
  #   调小: 更快判 lost
  window_seconds: 1.0

  # min_window_samples: 判据生效前窗口内的最小样本数
  #   范围: 10 ~ 50（100Hz 下 20 ≈ 0.2 秒）
  #   调大: 冷启动更安全，不会因为初期噪声误判
  min_window_samples: 20

  # nis_threshold: 单帧 NIS 超限阈值
  #   范围: -1（自动 95% 分位）或 5 ~ 20
  #   调大: 失败率下降；调小: 失败率上升
  nis_threshold: -1.0

  # tracker_fail_rate: Tracker 判 lost 的失败率阈值
  #   范围: 0.3 ~ 0.6
  #   含义: 窗口内超过这个比例的帧 NIS 超限，就判定目标已失配、重置跟踪
  #   调大: 更宽容；调小: 更容易丢目标
  tracker_fail_rate: 0.4
